name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd camstream
          gradle assembleRelease --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: camstream-apk
          path: camstream/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
