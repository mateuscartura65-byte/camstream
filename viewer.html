<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  img { max-width:100%; max-height:100vh; }
  #status { position:fixed; top:8px; left:8px; color:#8af; font:12px system-ui;
            background:#0008; padding:4px 8px; border-radius:8px; }
</style>
</head>
<body>
<div id="status">conectando...</div>
<img id="view" alt="">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const TOPICO = "venice/cam/pc";
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
  clientId: "pc_" + Math.random().toString(16).slice(2)
});
client.on('connect', () => {
  document.getElementById('status').textContent = 'conectado, aguardando...';
  client.subscribe(TOPICO, { qos: 0 });
});
client.on('message', (t, p) => {
  document.getElementById('view').src = 'data:image/jpeg;base64,' + p.toString();
  document.getElementById('status').textContent = 'ao vivo';
});
client.on('close', () => document.getElementById('status').textContent = 'desconectado');
</script>
</body>
</html>
