name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar componentes do Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Apontar o SDK para o Gradle
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Instalar Gradle 8.7
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verificar ferramentas
        run: |
          java -version
          gradle --version
          ls "$ANDROID_HOME/platforms"

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace --no-daemon --console=plain

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: camstream-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
